name: Vector CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/trace-rag-lab/package-lock.json
      - name: Run tests
        run: npm test
      - name: Build native C++ safety component
        run: npm run build:native
      - name: Run AI engineering project tests
        working-directory: apps/trace-rag-lab
        run: npm ci && npm test
