services:
  - type: web
    name: vector-vehicle-intelligence
    runtime: node
    plan: free
    buildCommand: npm install && npm run build:native
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
  - type: web
    name: trace-rag-lab
    runtime: node
    plan: free
    rootDir: ai-rag-eval-lab
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
